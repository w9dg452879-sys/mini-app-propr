<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini App</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }
    h1 { color: #4ade80; }
    .category {
      background: #1f2937;
      padding: 18px;
      margin: 12px 0;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>Mon application</h1>
  <p>Bienvenue sur notre application.</p>

  <h2>Catégories</h2>
  <div id="categories"></div>

  <script>
    const categories = [
      "Catégorie 1",
      "Catégorie 2",
      "Catégorie 3",
      "Catégorie 4"
    ];

    document.getElementById("categories").innerHTML =
      categories.map(name =>
        `<div class="category">${name}</div>`
      ).join("");
  </script>
</body>
</html>
